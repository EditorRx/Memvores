<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browse • MEMEVORES</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="logo">MEMEVORES</div>
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="index.html#about">About</a>
        <a href="index.html#how-it-works">How it works</a>
      </nav>
      <a id="telegram-header-btn" class="btn btn-sm" href="#" target="_blank" rel="noopener">
        Join Telegram
      </a>
    </div>
  </header>

  <section class="hero">
    <div class="container hero-inner">
      <h1 id="browse-title">Browse</h1>
      <p id="browse-subtitle" class="hero-subtitle">Search and filter posts by category.</p>
    </div>
  </section>

  <section class="content-section">
    <div class="container">
      <div class="filters">
        <select id="category-filter">
          <option value="all">All categories</option>
          <option value="clips">Clips</option>
          <option value="audio">Audio</option>
          <option value="templates">Templates</option>
          <option value="tutorials">Tutorials</option>
          <option value="other">Other</option>
        </select>

        <input
          id="search-input"
          type="text"
          placeholder="Search captions..."
        />
      </div>

      <div id="posts-grid" class="feed-grid"></div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <div class="logo">MEMEVORES</div>
        <p id="footer-tagline">Clips, sounds, templates, and chaos.</p>
      </div>

      <div class="footer-links">
        <div class="footer-col">
          <h4>Links</h4>
          <ul>
            <li><a id="footer-telegram" href="#" target="_blank" rel="noopener">Telegram</a></li>
            <li><a id="footer-youtube" href="#" target="_blank" rel="noopener">YouTube</a></li>
            <li><a id="footer-collab" href="#" target="_blank" rel="noopener">Collab</a></li>
          </ul>
        </div>

        <div class="footer-col">
          <h4>Social</h4>
          <div id="social-buttons" class="social-buttons"></div>
        </div>

        <div class="footer-col">
          <ul>
            <li><a href="https://t.me/+NZcBNeBvClFlMTE1" target="_blank" rel="noopener">Contact Admin</a></li>
            <li><a id="footer-support" href="index.html#support">Support</a></li>
            <li><a href="index.html#donate">Donate</a></li>
          </ul>
        </div>
      </div>
    </div>

    <div class="container copyright">
      <p>&copy; <span id="year"></span> MEMEVORES. Original tutorials. Materials credited.</p>
    </div>
  </footer>

  <script src="script.js"></script>
  <script src="browse.js"></script>
</body>
</html>
